name: Observer falsification experiment

on:
  push:
    branches: [main, "agent/**"]
  pull_request:
  workflow_dispatch:

jobs:
  test-and-experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Unit tests
        run: pytest
      - name: Run paired 30-seed experiment
        run: ai-dokimemo-experiment --output artifacts/experiment_v0_1 --seeds 30 --steps 140 --agents 16
      - name: Publish experiment summary
        if: always()
        run: |
          if [ -f artifacts/experiment_v0_1/REPORT.md ]; then
            cat artifacts/experiment_v0_1/REPORT.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload experiment artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-dokimemo-observer-experiment-v0-1
          path: artifacts/experiment_v0_1
          if-no-files-found: error
